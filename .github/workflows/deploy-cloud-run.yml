name: Verify and deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  SERVICE: resaikel
  REPOSITORY: resaikel
  GCP_PROJECT_ID: project-335e22ef-e3a3-4044-813
  GCP_REGION: us-central1
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/870158881572/locations/global/workloadIdentityPools/github-actions/providers/github
  GCP_DEPLOY_SERVICE_ACCOUNT: resaikel-deployer@project-335e22ef-e3a3-4044-813.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: resaikel-runtime@project-335e22ef-e3a3-4044-813.iam.gserviceaccount.com
  FIREBASE_API_KEY: AIzaSyBJ7CQhLUGRSU3G-tgHEBwgxCmXaeK10iQ
  FIREBASE_AUTH_DOMAIN: project-335e22ef-e3a3-4044-813.firebaseapp.com
  FIREBASE_STORAGE_BUCKET: project-335e22ef-e3a3-4044-813.firebasestorage.app
  FIREBASE_APP_ID: 1:870158881572:web:3634ec5adb76d1b59c19b1
  FIREBASE_MESSAGING_SENDER_ID: "870158881572"
  IMAGE: us-central1-docker.pkg.dev/project-335e22ef-e3a3-4044-813/resaikel/web

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="$FIREBASE_AUTH_DOMAIN" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="$GCP_PROJECT_ID" \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --tag "$IMAGE:${GITHUB_SHA}" \
            --tag "$IMAGE:latest" \
            .

      - name: Push image
        run: docker push --all-tags "$IMAGE"

      - name: Deploy revision
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "$IMAGE:${GITHUB_SHA}" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --allow-unauthenticated \
            --port 8080 \
            --cpu 2 \
            --memory 2Gi \
            --min 0 \
            --max 3 \
            --concurrency 80 \
            --cpu-throttling \
            --cpu-boost \
            --timeout 3600 \
            --set-env-vars "NEXT_PUBLIC_USE_FIREBASE_EMULATORS=false,FIREBASE_PROJECT_ID=$GCP_PROJECT_ID,NEXT_PUBLIC_FIREBASE_API_KEY=$FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID=$GCP_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_APP_ID=$FIREBASE_APP_ID,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID,AI_MODE=mock,NEXT_PUBLIC_DEFAULT_CURRENCY=IDR,NEXT_PUBLIC_DEFAULT_COUNTRY=ID,NEXT_PUBLIC_DEFAULT_LOCALE=id-ID" \
            --quiet

      - name: Show service URL
        run: gcloud run services describe "$SERVICE" --region "$GCP_REGION" --format='value(status.url)'
